name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # once a day, 3am UTC
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Adithya-Vipin
          outputs: |
            dist/snake.svg
            dist/snake-violet.svg?color_snake=A371F7,C9A9FF&color_dots=2b0a3d,3d2a5c,5c3d8c,8c5cc9,A371F7

      - name: Push the generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
